<style>
:root{--ink:#141414;--muted:#525252;--soft:#7A7A7A;--line:#EBEBEB;--blue:#2F5BD3;--bluetint:#EEF2FD;--red:#D9443F}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
@media (max-height:620px),(max-width:560px){html,body{overflow:auto}}
body{margin:0;background:#fff;color:var(--ink);font-family:Geist,system-ui,sans-serif;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px}
.top{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{display:flex;align-items:center;gap:9px;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:23px;letter-spacing:-.02em;line-height:1}
.top .small{font-size:13px;color:var(--soft)}
main{flex:1;width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 0 40px}

.pill{display:inline-flex;align-items:center;gap:8px;background:#FAFAFA;color:var(--ink);font-weight:500;font-size:13.5px;padding:6px 10px 6px 12px;border-radius:7px;border:1px solid #E2E2E2;border-bottom-width:2.5px;border-bottom-color:#D2D2D2;text-decoration:none;transition:transform .12s,border-bottom-width .12s}
.pill:hover{background:#fff}
.pill:active{transform:translateY(1.5px);border-bottom-width:1px}
.kbd{font-size:12px;color:var(--muted);background:#fff;border:1px solid #E2E2E2;border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:18px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(47,91,211,.5);animation:pulse 1.8s infinite}
@keyframes pulse{to{box-shadow:0 0 0 8px rgba(47,91,211,0)}}

h1{margin:0;font-family:Newsreader,Georgia,serif;font-size:clamp(44px,min(7.6vw,9.2vh),84px);line-height:1.02;letter-spacing:-.03em;font-weight:500}
h1 em{font-style:normal;color:var(--blue);white-space:nowrap}
h1 .glyph{display:inline-block;vertical-align:.55em;margin:0 .04em 0 .08em}
.lead{margin:22px auto 0;max-width:580px;font-size:16.5px;line-height:1.75;color:var(--muted)}
.lead b{color:var(--ink);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 9px;font-weight:500;color:var(--ink);white-space:nowrap;line-height:1.6}
.chip svg{flex:none}

/* who-talked-about-you notifications */
.demo{position:relative;width:100%;max-width:540px;height:130px;margin:44px auto 0;text-align:left}
.mc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 12px 28px -18px rgba(0,0,0,.25)}
.mc .a{width:34px;height:34px;border-radius:50%;background:#F4F4F4;display:grid;place-items:center;font-size:11.5px;font-weight:500;flex:none}
.mc .a.anon{background:#fff;border:1.5px dashed #D4D4D4;color:var(--soft)}
.mc .tx{flex:1;min-width:0}
.mc .l1{font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .l1 b{font-weight:500}
.mc .l2{font-size:12px;color:var(--soft);margin-top:2px}
.chip-t{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.chip-t i{width:7px;height:7px;border-radius:50%;display:block}
.pl{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
/* v2 stack */
.v2 .mc{position:absolute;left:0;right:0;top:8px;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .5s}

/* signup */
form{display:flex;gap:8px;margin:30px auto 0;width:100%;max-width:440px}
input{flex:1;min-width:0;border:1px solid #E2E2E2;border-radius:8px;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);background:#FCFCFC;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
input:focus{outline:2px solid var(--ink);outline-offset:-1px}
button{display:inline-flex;align-items:center;gap:10px;border:1px solid #000;border-bottom-width:3px;border-radius:8px;background:#1C1C1C;color:#fff;font:inherit;font-weight:500;font-size:15px;padding:11px 14px 9px 16px;cursor:pointer;white-space:nowrap;transition:transform .08s,border-bottom-width .08s}
button:hover{background:#2A2A2A}
button:active{transform:translateY(2px);border-bottom-width:1px}
button kbd{font:500 11px Geist,sans-serif;color:#BDBDBD;border:1px solid #444;border-radius:4px;padding:1px 5px}
.fine{margin:12px 0 0;font-size:13.5px;color:var(--soft)}
.ok{display:none;margin:34px auto 0;font-size:15px;color:#1F6B3D;background:#EEF8F1;border-radius:12px;padding:13px 16px}

/* coverage line */
.cov{width:100%;max-width:1100px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;padding:20px 0 26px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.cov b{color:var(--ink);font-weight:600}
.cov .prog{color:var(--soft)}

@media (max-height:780px) and (min-width:561px){
  .top{padding:14px 0}
  main{padding:8px 0 16px}
  h1{margin-top:16px}
  .lead{margin-top:14px;line-height:1.65}
  .demo{margin-top:28px;height:168px}
  form{margin-top:22px}
  .cov{padding:14px 0 16px}
}
@media (max-width:560px){
  .mc .l1{white-space:normal}
  .mc .pl{display:none}

  .top .small{display:none}
  form{flex-direction:column}
  .demo{margin-top:28px;height:190px}
  .lead{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>

<script>

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Notifications: who talked about you. Based on real monitored mentions, shown by role only (no names, no audio). */
const NOTES=[
  {i:"",   anon:true, who:"Oyente",                   say:"llamó para quejarse de ti",               where:"NotiUno 630 · llamada",   t:"neg"},
  {i:"CP", who:"Comentarista político",               say:"te defendió de ataques desde adentro",    where:"Radio Isla · 3:10 p.m.",  t:"pos"},
  {i:"LO", who:"Locutora",                            say:"te criticó por controlar la información", where:"WKAQ 580 · 3:36 p.m.",    t:"neg"},
  {i:"LP", who:"Líder política",                      say:"defendió tu protocolo en las escuelas",   where:"Radio Isla · 7:38 a.m.",  t:"pos"},
  {i:"LS", who:"Líder sindical",                      say:"reclamó el pago a los maestros",          where:"NotiUno 630 · 6:42 a.m.", t:"neg"},
  {i:"LE", who:"Legislador de tu partido",            say:"dijo que la controversia es autoinfligida",where:"NotiUno 630 · 9:11 a.m.", t:"neg"},
  {i:"CO", who:"Comentarista",                        say:"culpó a tu equipo, no a ti",              where:"Radio",                   t:"neu"},
];
const TONE={pos:["Positivo","#2F9E6B"],neg:["Negativo","#D9443F"],neu:["Mixto","#A3A3A3"]};
const PLAY='<span class="pl"><svg width="9" height="10" viewBox="0 0 10 12"><path d="M1 1l8 5-8 5z" fill="#141414"/></svg></span>';
const card=v=>`<div class="mc"><span class="a${v.anon?" anon":""}">${v.anon?"?":v.i}</span><div class="tx"><div class="l1"><b>${v.who}</b> ${v.say}</div><div class="l2">${v.where}</div></div><span class="chip-t"><i style="background:${TONE[v.t][1]}"></i>${TONE[v.t][0]}</span>${PLAY}</div>`;
(function(){
  const demo=document.getElementById("demo"); demo.className="demo v2"; let k=0; const stack=[];
  const lay=()=>stack.forEach((el,i)=>{ el.style.zIndex=10-i; el.style.transform=`translateY(${i*14}px) scale(${1-i*.045})`; el.style.opacity=i>2?0:1-i*.28; });
  const push=()=>{ const w=document.createElement("div"); w.innerHTML=card(NOTES[k++%NOTES.length]); const el=w.firstElementChild;
    el.style.transform="translateY(-18px)"; el.style.opacity=0; demo.appendChild(el); stack.unshift(el);
    requestAnimationFrame(()=>requestAnimationFrame(lay)); if(stack.length>4){ const gone=stack.pop(); setTimeout(()=>gone.remove(),500);} };
  push(); setTimeout(push,250); setTimeout(push,500);
  if(!reduce) setInterval(push,3200);
})();

/* ============================================================
   SIGNUP: set FORM_ENDPOINT to a URL that accepts a JSON POST
   (Supabase edge function, Formspree, etc.). Until then it
   opens an email draft.
   ============================================================ */
const FORM_ENDPOINT = "";
const FALLBACK_EMAIL = "hola@resuenapr.com";
document.getElementById("signup").addEventListener("submit", async e=>{
  e.preventDefault();
  const input=e.target.correo;
  if(!input.value || !input.checkValidity()){ input.focus(); return; }
  if(FORM_ENDPOINT){ try{ await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({correo:input.value,source:"landing"})}); }catch(_){} }
  else { location.href=`mailto:${FALLBACK_EMAIL}?subject=${encodeURIComponent("Piloto Resuena")}&body=${encodeURIComponent("Quiero unirme al piloto. Mi correo: "+input.value)}`; }
  e.target.style.display="none"; document.getElementById("ok").style.display="block";
});
</script>
